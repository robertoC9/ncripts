<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard – Ncripts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<header id="mainHeader">
    <img src="ncripts_logo_light.svg" alt="Ncripts Logo" id="headerLogo">
</header>

<div class="container">

    <h1>Archivos Encriptados</h1>
    <p class="subtitle">Lista de archivos almacenados en Supabase Storage</p>

    <div id="fileList" class="file-list">
        <!-- Aquí se cargan los archivos -->
    </div>

</div>

<a class="dashboard-link" href="index.html">Ir al Encriptador</a>

<footer id="mainFooter">
    <p id="footerTime"></p>
    <p id="footerRegion"></p>
    <p id="footerLang"></p>
    <p id="footerIP"></p>
    <p id="footerSystem"></p>
    <p id="footerVersion">Versión de la app: 1.1</p>
</footer>

<script type="module" src="supabase.js"></script>
<script type="module" src="dashboard.js"></script>
<script src="footer.js"></script>

</body>
</html>
