<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ncripts – Encriptador Seguro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header id="mainHeader">
    <img src="ncripts_logo.svg" alt="Ncripts Logo" id="headerLogo">
</header>

<!-- CONTENEDOR -->
<div class="container">

    <h1>Encriptador de Archivos</h1>

    <p class="subtitle">
        Protege tus documentos con encriptación avanzada AES-256.
    </p>

    <div class="input-group">
        <label>Selecciona un archivo</label>
        <input type="file" id="fileInput">
    </div>

    <div class="input-group">
        <label for="passwordInput">Contraseña de encriptación</label>
        <input type="password" id="passwordInput" autocomplete="new-password">
    </div>

    <div class="buttons">
        <button class="primary" id="encryptBtn">Encriptar</button>
        <button class="secondary" id="decryptBtn">Desencriptar</button>
    </div>

    <p id="status"></p>

</div>

<a class="dashboard-link" href="dashboard.html">Ir al Dashboard</a>

<button class="logout-button" id="logoutBtn" type="button">Cerrar sesión</button>

<!-- FOOTER -->
<footer id="mainFooter">
    <p id="footerTime"></p>
    <p id="footerRegion"></p>
    <p id="footerLang"></p>
    <p id="footerIP"></p>
    <p id="footerSystem"></p>
    <p id="footerVersion">Versión de la app: 1.0.0</p>
</footer>

<script type="module" src="supabase.js"></script>
<script type="module" src="app.js"></script>
<script src="footer.js"></script>

</body>
</html>
