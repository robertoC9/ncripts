<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NcripTs</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>Encriptador de Archivos</h1>

    <div class="input-group">
        <label>Selecciona un archivo</label>
        <input type="file" id="fileInput">
    </div>

    <div class="input-group">
        <label>Contraseña para encriptar</label>
        <input type="password" id="passwordInput" placeholder="Escribe tu contraseña">
    </div>

    <div class="buttons">
        <button id="encryptBtn" class="primary">Encriptar</button>
        <button id="decryptBtn" class="secondary">Desencriptar</button>
    </div>

    <p id="status"></p>

    <button id="logoutBtn" class="secondary" style="margin-top:20px;width:100%;">Cerrar sesión</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
