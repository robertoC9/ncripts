<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso – Ncripts</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<header id="mainHeader">
    <img src="ncripts_logo.svg" alt="Ncripts Logo" id="headerLogo">
</header>

<!-- CONTENEDOR -->
<div class="container">

    <h1>Iniciar Sesión</h1>

    <div class="input-group">
        <label>Email</label>
        <input type="email" id="emailInput">
    </div>

    <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="passInput">
    </div>

    <div class="buttons">
        <button class="primary" id="loginBtn">Entrar</button>
        <button class="secondary" id="registerBtn">Registrar</button>
    </div>

    <p id="status"></p>

</div>

<!-- FOOTER -->
<footer id="mainFooter">
    <p id="footerTime"></p>
    <p id="footerRegion"></p>
    <p id="footerLang"></p>
    <p id="footerIP"></p>
    <p id="footerSystem"></p>
    <p id="footerVersion">Versión de la app: 1.0.0</p>
</footer>

<script type="module" src="supabase.js"></script>
<script type="module" src="login.js"></script>
<script src="footer.js"></script>

</body>
</html>
